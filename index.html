<script>window.onerror=function(m,u,l){var d=document.createElement("pre");d.style.cssText="padding:14px;margin:0;background:#fff;color:#b00;white-space:pre-wrap;font:14px monospace";d.textContent="Erro no site: "+m+" (linha "+l+")";(document.body||document.documentElement).prepend(d)};window.addEventListener("load",function(){if(!window.supabase){var d=document.createElement("pre");d.style.cssText="padding:14px;background:#fff;color:#b00";d.textContent="A biblioteca do Supabase não carregou (internet ou bloqueio).";document.body.prepend(d)}})</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#292929;--mut:#6f6663;--line:#eee8e6;--brand:#c2183a;--accent:#9f1239;--soft:#fbe9ed;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1c2520;--ink:#eef2ec;--mut:#9aa79f;--line:#2c3731;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 120px}
h1{font-size:1.35rem;line-height:1.15;margin:0 0 4px;font-weight:800;overflow-wrap:anywhere}
h2{font-size:1.1rem;margin:24px 0 8px;font-weight:800;color:var(--brand)}
p{margin:0}.mut{color:var(--mut)}
.top::after{content:"";display:block;height:1px;margin-top:12px;background:var(--line)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row>div:first-child{min-width:0;flex:1}.row b,.row p{overflow-wrap:anywhere}
.row.wrap,.row.wrap .step{flex-wrap:wrap}
.price{font-weight:800;white-space:nowrap;color:var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 16px;min-height:44px;background:var(--brand);color:#fff;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.6}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{min-height:38px;padding:0 12px;font-size:.9rem}
button.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;padding:0;font-size:1.3rem}
.row .step button.sm{width:auto;font-size:.9rem;padding:0 12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar button{display:flex;width:100%;max-width:612px;margin:0 auto;justify-content:space-between;align-items:center;background:var(--accent)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=color]{height:46px;padding:4px}
input[type=radio]{width:20px;height:20px;padding:0;flex:none}
.opts,.pay{display:flex;gap:8px;flex-wrap:wrap}
.opts label,.pay label{display:flex;gap:10px;align-items:center;flex:1 1 140px;margin:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-weight:600}
.opts label:has(input:checked),.pay label:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.big{font-size:4.5rem;font-weight:800;color:var(--accent);line-height:1;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -14px;padding:0 14px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--line)}
.ord{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px}
.ord.ok{border-left-color:var(--brand)}
.ord .hd{display:flex;justify-content:space-between;align-items:center}
.ord .n{font-size:1.6rem;font-weight:800}.ord ul{margin:8px 0;padding-left:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts button{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.pix{border:2px dashed var(--brand);border-radius:12px;padding:12px;margin-top:14px}
.key{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere;user-select:all;margin:4px 0 8px}
.err{color:var(--accent);font-weight:600;margin-top:8px}
.foot{margin-top:30px;text-align:center}.foot button{background:none;color:var(--mut);font-weight:400;text-decoration:underline}
.off{opacity:.55}
.chips{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--bg);margin:8px -14px 0;padding:10px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
h2{scroll-margin-top:64px}.row.pr{align-items:center}.row.pr>.ph{flex:none;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:1.6rem;opacity:.9}
.ph img{width:100%;height:100%;object-fit:cover}.row.pr>.pi{min-width:0;flex:1}
.th{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:1.3rem}.th img{width:100%;height:100%;object-fit:cover;display:block}
.hd2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}.hd2 h2{margin:0}
dialog{border:0;border-radius:18px;padding:20px;width:min(94vw,460px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(0,0,0,.5)}dialog h2{margin:0 0 4px}
.pf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dz{width:112px;height:112px;flex:none;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden;color:var(--mut)}.dz.on{border-color:var(--brand)}.dz.has{border-style:solid}
.dz img{width:100%;height:100%;object-fit:cover;display:block}.dz svg{width:32px;height:32px}
.pa{flex:1 1 170px;min-width:0;display:grid;gap:8px;justify-items:start}.pa p{font-size:.82rem}
button.pk{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}button.pk svg{width:18px;height:18px}
button.rm{background:none;color:var(--accent);min-height:36px;padding:0 4px;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.hasnav #app{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}.hasnav .bar{bottom:calc(58px + env(safe-area-inset-bottom,0px));border-top:0;background:transparent;padding-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:58px;padding:6px 0;background:none;color:var(--mut);border-radius:0;font-size:.72rem;font-weight:600}
.nav button.on{color:var(--brand)}.nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav svg{width:22px;height:22px}.nav i{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font:700 .68rem/18px system-ui;text-align:center}
@media(min-width:900px){body.hasnav{padding-left:92px}.nav{top:0;right:auto;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 0;border-top:0;border-right:1px solid var(--line)}.nav button{flex:none;min-height:64px}.nav button.on::before{top:12px;bottom:12px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}.hasnav #app{max-width:720px;padding-bottom:40px}.hasnav .bar{left:92px;bottom:0}.hasnav .bar button{max-width:692px}}
input.srch{margin-top:12px}
.row.pr .pi b{overflow-wrap:break-word;hyphens:auto}@media(max-width:420px){.row.pr>.ph{width:72px;height:72px}.row.pr .step{gap:6px}.row.pr .step button{width:40px}}.chips a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ph svg,.th svg{width:28px;height:28px;color:var(--mut)}.empty{text-align:center;padding:40px 10px}.empty svg{width:40px;height:40px;color:var(--mut);margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURE AQUI (Supabase > Project Settings > API) ===== */
const SUPABASE_URL="COLE_AQUI_A_URL_DO_PROJETO";
const SUPABASE_KEY="COLE_AQUI_A_CHAVE_ANON_PUBLIC";
/* ============================================================== */

const $=s=>document.querySelector(s);
const brl=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>String(n).padStart(3,"0");
const ST={novo:"Novo",preparo:"Em preparo",pronto:"Pronto",entregue:"Entregue",cancelado:"Cancelado"};
const NEXT={novo:["preparo","Começar preparo"],preparo:["pronto","Marcar como pronto"],pronto:["entregue","Marcar como entregue"]};
const configured=!SUPABASE_URL.startsWith("COLE");
const db=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let cfg={chave_pix:"",nome_loja:"Minha Lanchonete",mensagem:"",cor_principal:"#c2183a",cor_destaque:"#9f1239"};
let menu=[],orders=[],cart={},subscribed=false;
let V={mode:"cli",step:"menu",tab:"ped",f:"ativos",last:null,auth:false,user:null,perfil:{},aba:"entrar",mine:[],msg:"",err:"",loading:true};

const pays=()=>[...(cfg.chave_pix?["Pix"]:[]),"Dinheiro","Cartão"];
const pixCard=t=>`<div class="pix"><p class="mut">Pague por Pix. Chave da loja:</p><p class="key">${esc(cfg.chave_pix)}</p><p>Valor: <b>${brl(t)}</b></p><div class="acts"><button class="sm" data-a="copy">Copiar chave</button></div><p class="mut" style="margin-top:8px">Depois de pagar, mostre o comprovante à loja com o número do pedido.</p></div>`;
const lines=()=>Object.entries(cart).map(([id,q])=>{const m=menu.find(x=>x.id==id);return m&&q>0?{...m,q}:null}).filter(Boolean);
const total=()=>lines().reduce((a,l)=>a+l.preco*l.q,0);
const count=()=>lines().reduce((a,l)=>a+l.q,0);

async function loadCfg(){const{data}=await db.from("configuracao").select("*").eq("id",1).maybeSingle();if(data)cfg=data}
async function loadMe(){
  const{data:s}=await db.auth.getSession();V.user=s.session?s.session.user:null;V.auth=false;V.perfil={};
  if(V.user){const{data}=await db.from("perfis").select("*").eq("id",V.user.id).maybeSingle();V.perfil=data||{};V.auth=V.perfil.papel==="vendedor"}
}
async function loadMine(){const{data}=await db.from("pedidos").select("*").order("numero",{ascending:false}).limit(30);V.mine=data||[]}
async function loadMenu(){
  let q=db.from("itens").select("*").order("categoria").order("id");
  const{data,error}=await q;if(error)V.err=error.message;else menu=data||[];
}
async function loadOrders(){const{data}=await db.from("pedidos").select("*").order("numero",{ascending:false}).limit(200);orders=data||[]}
function subscribe(){
  if(subscribed)return;subscribed=true;
  db.channel("pedidos").on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},async()=>{await loadOrders();if(V.mode==="loja"&&V.tab==="ped")render()}).subscribe();
}

/* ===== Fotos dos produtos (mesmo fluxo do admin.html) ===== */
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>';
let PH={};
async function prepFoto(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw new Error("Formato não aceito. Use uma foto JPG, PNG ou WebP.");
  if(f.size>5242880)throw new Error("A foto passa de 5 MB. Escolha uma menor.");
  let bm;try{bm=await createImageBitmap(f)}catch(x){throw new Error("Não consegui ler essa imagem. Tente outra foto.")}
  const r=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Não consegui processar a foto.")),"image/webp",.82))}
function pshowF(){const u=PH.blob?PH.prev:(PH.rm?"":PH.foto);
  $("#pv").innerHTML=u?`<img src="${esc(u)}" alt="Prévia da foto do produto">`:CAM;$("#pv").classList.toggle("has",!!u);
  $("#pb").innerHTML=`${CAM}${u?"Trocar foto":"Adicionar foto"}`;
  $("#pt").textContent=PH.blob?"Prévia da nova foto. Ela só é enviada quando você tocar em Salvar item.":u?"Foto atual do produto.":"JPG, PNG ou WebP, até 5 MB. Você também pode arrastar a foto para o quadro.";
  $("#pr").hidden=!u}
async function pickF(f){$("#pe").textContent="";if(!f)return;$("#pb").disabled=true;$("#pt").textContent="Preparando a foto…";
  try{const b=await prepFoto(f);if(PH.prev)URL.revokeObjectURL(PH.prev);PH.blob=b;PH.prev=URL.createObjectURL(b);PH.rm=false}catch(x){$("#pe").textContent=x.message}
  $("#pb").disabled=false;pshowF()}
function openItem(id){const m=menu.find(x=>x.id==id)||{};PH={id:m.id||null,foto:m.foto_url||"",blob:null,prev:"",rm:false};
  $("#dg").innerHTML=`<h2>${id?"Editar item":"Novo item"}</h2><label for="in">Nome</label><input id="in" value="${esc(m.nome||"")}" maxlength="80"><label for="id">Descrição (opcional)</label><input id="id" value="${esc(m.descricao||"")}" maxlength="160">
  <div class="grid2"><div><label for="ip">Preço (R$)</label><input id="ip" inputmode="decimal" value="${m.preco!=null?m.preco:""}" placeholder="0,00"></div><div><label for="ic">Categoria</label><input id="ic" list="cl" value="${esc(m.categoria||"")}" placeholder="Ex.: Lanches"><datalist id="cl">${[...new Set(menu.map(x=>x.categoria))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div></div>
  <label for="pb">Foto do produto</label><div class="pf"><div class="dz" id="pv"></div><div class="pa"><button type="button" class="ghost pk" id="pb" data-a="pkf"></button><button type="button" class="rm" id="pr" data-a="rmf">Remover foto</button><p class="mut" id="pt"></p></div></div><input id="pf" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <p class="err" id="pe" role="alert"></p><div class="acts"><button class="ghost" style="flex:0 0 auto" data-a="cxf">Cancelar</button><button data-a="svf">Salvar item</button></div>`;
  pshowF();$("#dg").showModal()}
const rmFoto=async u=>{const p=(u.split("/produtos/")[1]||"").split("?")[0];if(p)await db.storage.from("produtos").remove([p])};
async function saveItem(b){const e=$("#pe"),nome=$("#in").value.trim(),preco=parseFloat($("#ip").value.replace(",","."));
  if(!nome){e.textContent="Informe o nome do item.";return}if(!(preco>=0)){e.textContent="Informe um preço válido, como 18,50.";return}
  b.disabled=true;b.textContent="Salvando…";e.textContent="";let nova="",old="";
  try{let url=PH.foto;
    if(PH.blob){const p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+(PH.blob.type==="image/webp"?".webp":".png");
      const u=await db.storage.from("produtos").upload(p,PH.blob,{contentType:PH.blob.type,cacheControl:"31536000"});if(u.error)throw u.error;
      nova=url=db.storage.from("produtos").getPublicUrl(p).data.publicUrl;old=PH.foto}else if(PH.rm){url="";old=PH.foto}
    const row={nome,descricao:$("#id").value.trim(),preco,categoria:$("#ic").value.trim()||"Outros",foto_url:url};
    const r=PH.id?await db.from("itens").update(row).eq("id",PH.id):await db.from("itens").insert(row);if(r.error)throw r.error;
    if(old)try{await rmFoto(old)}catch(x){}
    $("#dg").close();V.err="";await loadMenu();render()
  }catch(x){if(nova)try{await rmFoto(nova)}catch(y){}e.textContent="Não foi possível salvar: "+(x.message||x);b.disabled=false;b.textContent="Salvar item"}}

const IC=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const NOFOTO=IC('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>');
const NAVI={home:["Início",'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/>'],busca:["Buscar",'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>'],ped:["Pedidos",'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/>'],cart:["Carrinho",'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>'],perfil:["Perfil",'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>']};
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function navHtml(){const on=V.step==="meus"?"ped":V.step==="check"?"cart":V.step==="perfil"?"perfil":V.step==="done"?"":V.q?"busca":"home";
  return `<nav class="nav" aria-label="Navegação principal">${Object.entries(NAVI).map(([k,[t,d]])=>`<button data-a="nav" data-id="${k}" class="${on===k?"on":""}" ${on===k?'aria-current="page"':""}>${IC(d)}<span>${t}</span>${k==="cart"&&count()?`<i aria-label="${count()} itens">${count()}</i>`:""}</button>`).join("")}</nav>`}
function spy(){const hs=[...document.querySelectorAll("#lista h2[id]")];if(!hs.length)return;let k=0;hs.forEach((h,i)=>{if(h.getBoundingClientRect().top<=90)k=i});if(LK&&Date.now()-LK.t<800)k=LK.i;else if(innerHeight+scrollY>=document.documentElement.scrollHeight-2)k=hs.length-1;
  const as=[...document.querySelectorAll(".chips a")];as.forEach((a,i)=>a.classList.toggle("on",i===k));const a=as[k];if(a){const c=a.parentNode;if(c.scrollWidth>c.clientWidth)c.scrollTo({left:a.offsetLeft-c.clientWidth/2+a.offsetWidth/2})}}
let LK=null;document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest(".chips a");if(a){LK={i:[...a.parentNode.children].indexOf(a),t:Date.now()};setTimeout(spy,60)}});
["wheel","touchstart","keydown"].forEach(t=>addEventListener(t,()=>{LK=null},{passive:true}));
addEventListener("scroll",spy,{passive:true});
document.addEventListener("input",e=>{if(e.target.id==="q"){V.q=e.target.value;const l=$("#lista");if(l){l.innerHTML=lista();spy()}}});
function lista(){const M=V.q?menu.filter(m=>norm(m.nome+" "+(m.descricao||"")+" "+m.categoria).includes(norm(V.q))):menu;let h="";
  if(!M.length)return `<div class="empty">${IC('<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>')}<p>Nada encontrado para “${esc(V.q)}”.</p></div>`;
  const CT=[...new Set(M.map(m=>m.categoria))];if(CT.length>1)h+=`<nav class="chips" aria-label="Categorias">${CT.map((c,i)=>`<a href="#c${i}">${esc(c)}</a>`).join("")}</nav>`;
  CT.forEach((c,i)=>{
    h+=`<h2 id="c${i}">${esc(c)}</h2>`;
    M.filter(m=>m.categoria===c).forEach(m=>{
      const q=cart[m.id]||0;
      h+=`<div class="row pr${m.disponivel?"":" off"}"><div class="ph">${m.foto_url?`<img src="${esc(m.foto_url)}" alt="" loading="lazy" decoding="async">`:NOFOTO}</div><div class="pi"><b>${esc(m.nome)}</b><p class="mut">${esc(m.descricao||"")}</p><span class="price">${brl(m.preco)}</span></div>`+
      (!m.disponivel?`<span class="tag">Indisponível</span>`:q?`<div class="step"><button class="ghost" data-a="sub" data-id="${m.id}" aria-label="Tirar um">−</button><b>${q}</b><button data-a="add" data-id="${m.id}" aria-label="Adicionar mais um">+</button></div>`:`<button data-a="add" data-id="${m.id}">Adicionar</button>`)+`</div>`;
    });
  });
  return h}

function render(){const hx=/^#[0-9a-f]{6}$/i,st=document.documentElement.style;if(hx.test(cfg.cor_principal))st.setProperty("--brand",cfg.cor_principal);if(hx.test(cfg.cor_destaque))st.setProperty("--accent",cfg.cor_destaque);
  document.documentElement.style.setProperty("--brand",cfg.cor_principal);
  document.documentElement.style.setProperty("--accent",cfg.cor_destaque);
  document.title=cfg.nome_loja;
  const nav=configured&&V.mode==="cli"&&!V.loading;$("#app").innerHTML=(!configured?setup():V.mode==="conta"?conta():V.mode==="cli"?cli():loja())+(nav?navHtml():"");document.body.classList.toggle("hasnav",nav);
  if(V.fx==="q"){const q=$("#q");if(q)q.focus()}else if(V.fx==="top")scrollTo(0,0);V.fx="";spy();
}

function setup(){
  return `<header class="top"><h1>Falta conectar o banco de dados</h1></header><div class="card"><p>Abra este arquivo em um editor de texto e preencha no início do código:</p><p style="margin:8px 0"><b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b></p><p class="mut">Você encontra os dois em Supabase &gt; Project Settings &gt; API.</p></div>`;
}

function cli(){
  const who=V.user?`<p style="margin-top:8px"><span class="mut">Olá, ${esc(V.perfil.nome||V.user.email)}</span> `+(V.auth?`<button class="ghost sm" data-a="loja">Painel da loja</button> `:`<button class="ghost sm" data-a="meus">Meus pedidos</button> `)+`<button class="ghost sm" data-a="logout">Sair</button></p>`:`<p class="mut" style="margin-top:8px">Não precisa de conta para pedir. <button class="ghost sm" data-a="conta">Entrar ou criar conta</button></p>`;
  const head=`<header class="top"><h1>${esc(cfg.nome_loja)}</h1><p class="mut">${esc(cfg.mensagem)}</p></header>`;
  if(V.step==="perfil")return head+`<h2>Perfil</h2>`+(V.user?`<div class="row"><div><b>${esc(V.perfil.nome||"Cliente")}</b><p class="mut">${esc(V.user.email||"")}${V.perfil.telefone?" · "+esc(V.perfil.telefone):""}</p></div></div>`:`<p class="mut">Entre para acompanhar seus pedidos e guardar seus dados. Você também pode pedir sem conta.</p>`)+`<div class="acts">${V.user?(V.auth?`<button data-a="loja">Painel da loja</button>`:"")+`<button class="ghost" data-a="logout">Sair</button>`:`<button data-a="conta">Entrar ou criar conta</button><button class="ghost" data-a="loja">Área da loja</button>`}</div>`;
  if(V.loading)return head+`<p class="mut" style="margin-top:20px">Carregando cardápio…</p>`;
  if(V.step==="done")return head+`<div class="card"><p>Pedido enviado! O número do seu pedido é:</p><div class="big">${num(V.last)}</div><p>Guarde este número e informe à loja ao retirar ou receber.</p>${(V.paid||{}).pg==="Pix"?pixCard(V.paid.tot):`<p class="mut" style="margin-top:8px">Pagamento: ${(V.paid||{}).pg}.</p>`}<div class="acts"><button data-a="again">Fazer novo pedido</button></div></div>`;
  if(V.step==="meus")return head+`<h2>Meus pedidos</h2>`+(!V.user?`<p class="mut">Entre na sua conta para acompanhar seus pedidos.</p><div class="acts"><button data-a="conta">Entrar ou criar conta</button></div>`:V.mine.length?V.mine.map(o=>`<div class="ord ${o.status==="pronto"||o.status==="entregue"?"ok":""}"><div class="hd"><span class="n">#${num(o.numero)}</span><span class="tag">${ST[o.status]}</span></div><ul>${o.itens.map(i=>`<li>${i.qtd}× ${esc(i.nome)}</li>`).join("")}</ul><p class="price">${brl(o.total)}</p></div>`).join(""):`<p class="mut">Você ainda não fez pedidos.</p>`)+`<div class="acts"><button class="ghost" data-a="back">Voltar ao cardápio</button><button data-a="meus">Atualizar</button></div>`;
  if(V.step==="check"&&!count())return head+`<div class="empty">${IC(NAVI.cart[1])}<p>Seu carrinho está vazio.</p><div class="acts" style="justify-content:center"><button data-a="back">Ver cardápio</button></div></div>`;
  if(V.step==="check"){
    return head+`<h2>Seu pedido</h2>`+lines().map(l=>`<div class="row"><span>${l.q}× ${esc(l.nome)}</span><span class="price">${brl(l.preco*l.q)}</span></div>`).join("")+
    `<div class="row"><b>Total</b><span class="price">${brl(total())}</span></div>
    <label for="cn">Seu nome</label><input id="cn" autocomplete="name" value="${esc(V.perfil.nome||"")}">
    <label for="cp">Telefone</label><input id="cp" type="tel" autocomplete="tel" value="${esc(V.perfil.telefone||"")}">
    <label>Como quer receber?</label><div class="opts"><label><input type="radio" name="tp" value="Retirada" checked data-a="tp"> Retirar na loja</label><label><input type="radio" name="tp" value="Entrega" data-a="tp"> Entrega</label></div>
    <div id="ad" hidden><label for="ca">Endereço de entrega</label><input id="ca"></div>
    <label>Forma de pagamento</label><div class="pay">${pays().map((p,i)=>`<label><input type="radio" name="pg" value="${p}" ${i?"":"checked"}> ${p}</label>`).join("")}</div>
    <label for="co">Observações (opcional)</label><textarea id="co" rows="2" placeholder="Ex.: sem cebola"></textarea>
    ${V.err?`<p class="err">${esc(V.err)}</p>`:""}
    <div class="acts"><button class="ghost" data-a="back">Voltar ao cardápio</button><button data-a="send">Enviar pedido</button></div>`;
  }
  let h=head+(V.err?`<p class="err">${esc(V.err)}</p>`:"");
  if(!menu.length)h+=`<p class="mut" style="margin-top:20px">Nenhum item disponível no momento.</p>`;
  h+=`<input id="q" class="srch" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="O que você deseja comer?" aria-label="Buscar no cardápio" value="${esc(V.q||"")}"><div id="lista">${lista()}</div>`;
  if(count())h+=`<div class="bar"><button data-a="check"><span>Ver carrinho (${count()})</span><span>${brl(total())}</span></button></div>`;
  return h;
}

function conta(){
  const A=V.aba,vend=A==="vendedor",novo=A!=="entrar";
  return `<header class="top"><h1>${esc(cfg.nome_loja)}</h1><p class="mut">Entre ou crie sua conta</p></header><div class="tabs">`+[["entrar","Entrar"],["cliente","Novo cliente"],["vendedor","Novo vendedor"]].map(t=>`<button class="${A===t[0]?"on":""}" data-a="aba" data-id="${t[0]}">${t[1]}</button>`).join("")+`</div><div class="card" style="margin-top:0">`+
  (novo?`<label for="rn">Nome</label><input id="rn" autocomplete="name"><label for="rt">Telefone</label><input id="rt" type="tel" autocomplete="tel">`:"")+
  `<label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Senha${novo?" (mínimo 6 caracteres)":""}</label><input id="pw" type="password" autocomplete="${novo?"new-password":"current-password"}">`+
  (vend?`<label for="rc">Código da loja</label><input id="rc" placeholder="Fornecido pelo dono da loja">`:"")+
  (V.err?`<p class="err">${esc(V.err)}</p>`:"")+(V.msg?`<p style="margin-top:8px;font-weight:600">${esc(V.msg)}</p>`:"")+
  `<div class="acts"><button class="ghost" data-a="exit">Continuar sem conta</button><button data-a="${novo?"signup":"login"}">${novo?"Criar conta":"Entrar"}</button></div></div>`;
}

function loja(){
  const top=`<header class="top"><h1>Painel da loja</h1><p class="mut">${esc(cfg.nome_loja)}</p></header>`;
  if(!V.auth)return top+`<div class="card"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password">${V.err?`<p class="err">${esc(V.err)}</p>`:""}<div class="acts"><button class="ghost" data-a="exit">Continuar sem conta</button><button data-a="login">Entrar</button></div></div>`;
  let h=top+`<div class="tabs">`+[["ped","Pedidos"],["menu","Cardápio"],["apa","Ajustes"]].map(t=>`<button class="${V.tab===t[0]?"on":""}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join("")+`<button class="ghost" data-a="logout">Sair</button></div>`;
  if(V.err)h+=`<p class="err">${esc(V.err)}</p>`;
  if(V.tab==="ped"){
    h+=`<div class="tabs">`+[["ativos","Em andamento"],["entregue","Entregues"],["cancelado","Cancelados"]].map(f=>`<button class="${V.f===f[0]?"on":""}" data-a="f" data-id="${f[0]}">${f[1]}</button>`).join("")+`</div>`;
    const os=orders.filter(o=>V.f==="ativos"?["novo","preparo","pronto"].includes(o.status):o.status===V.f);
    if(!os.length)h+=`<p class="mut">Nenhum pedido aqui. Pedidos novos aparecem sozinhos, com o número.</p>`;
    os.forEach(o=>{
      h+=`<div class="ord ${o.status==="pronto"||o.status==="entregue"?"ok":""}"><div class="hd"><span class="n">#${num(o.numero)}</span><span class="tag">${ST[o.status]}</span></div>
      <p><b>${esc(o.cliente)}</b> · ${esc(o.telefone)} · ${o.tipo}${o.endereco?": "+esc(o.endereco):""}</p>
      <ul>${o.itens.map(i=>`<li>${i.qtd}× ${esc(i.nome)}</li>`).join("")}</ul>
      <p class="mut">Pagamento: ${esc(o.pagamento||"—")}</p>
      ${o.observacao?`<p class="mut">Obs.: ${esc(o.observacao)}</p>`:""}
      <p class="price">${brl(o.total)} <span class="mut" style="font-weight:400">· ${new Date(o.criado_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span></p>
      <div class="acts">${NEXT[o.status]?`<button data-a="next" data-id="${o.numero}">${NEXT[o.status][1]}</button><button class="danger" data-a="cancel" data-id="${o.numero}">Cancelar</button>`:""}</div></div>`;
    });
  }
  if(V.tab==="menu"){
    h+=`<div class="hd2"><h2>Itens cadastrados</h2><button class="sm" data-a="newi">+ Novo item</button></div><p class="mut" style="margin-bottom:8px">Só os itens marcados como disponíveis aparecem para o cliente.</p>`;
    menu.forEach(m=>{
      h+=`<div class="row wrap ${m.disponivel?"":"off"}"><div style="display:flex;gap:10px;align-items:center"><span class="th">${m.foto_url?`<img src="${esc(m.foto_url)}" alt="" loading="lazy" decoding="async">`:NOFOTO}</span><div style="min-width:0"><b>${esc(m.nome)}</b><p class="mut">${esc(m.categoria)}</p></div></div><div class="step"><input data-ch="${m.id}" type="number" step="0.5" min="0" value="${m.preco}" style="width:90px" aria-label="Preço de ${esc(m.nome)}"><button class="ghost sm" data-a="edi" data-id="${m.id}">Editar</button><button class="${m.disponivel?"":"ghost"} sm" data-a="tog" data-id="${m.id}">${m.disponivel?"Disponível":"Indisponível"}</button><button class="danger sm" data-a="del" data-id="${m.id}">Remover</button></div></div>`;
    });
  }
  if(V.tab==="apa")h+=`<div class="card" style="margin-top:0"><label for="sn">Nome da loja</label><input id="sn" value="${esc(cfg.nome_loja)}"><label for="sm">Mensagem de boas-vindas</label><textarea id="sm" rows="2">${esc(cfg.mensagem)}</textarea><div class="grid2"><div><label for="sc">Cor principal (verde)</label><input id="sc" type="color" value="${cfg.cor_principal}"></div><div><label for="sd">Cor de destaque (vermelho)</label><input id="sd" type="color" value="${cfg.cor_destaque}"></div></div><label for="sx">Chave Pix (deixe vazio para não aceitar Pix)</label><input id="sx" value="${esc(cfg.chave_pix||"")}" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória"><div class="acts"><button data-a="saveCfg">Salvar</button></div></div>`;
  return h;
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=s=>($(s)||{value:""}).value.trim();
  if(a==="pkf"){$("#pf").click();return}
  if(a==="rmf"){PH.blob=null;PH.rm=true;$("#pf").value="";pshowF();return}
  if(a==="cxf"){$("#dg").close();return}
  if(a==="svf"){await saveItem(b);return}
  if(a==="newi"){openItem();return}
  if(a==="edi"){openItem(id);return}
  if(a==="tp"){$("#ad").hidden=b.value!=="Entrega";return}
  if(a==="copy"){try{await navigator.clipboard.writeText(cfg.chave_pix);b.textContent="Chave copiada"}catch(x){b.textContent="Selecione e copie a chave"}return}
  let r=null;V.err="";
  if(a==="add")cart[id]=(cart[id]||0)+1;
  else if(a==="sub")cart[id]=Math.max(0,(cart[id]||0)-1);
  else if(a==="check")V.step="check";
  else if(a==="back")V.step="menu";
  else if(a==="again"){cart={};V.step="menu";await loadMenu()}
  else if(a==="send"){
    const keep={cn:v("#cn"),cp:v("#cp"),ca:v("#ca"),co:v("#co")},type=document.querySelector("input[name=tp]:checked").value,pg=document.querySelector("input[name=pg]:checked").value;
    const restore=()=>{render();for(const k in keep)$("#"+k).value=keep[k];if(type==="Entrega"){document.querySelector("input[value=Entrega]").checked=true;$("#ad").hidden=false}document.querySelectorAll("input[name=pg]").forEach(x=>x.checked=x.value===pg)};
    if(!keep.cn||!keep.cp||(type==="Entrega"&&!keep.ca)){V.err="Preencha nome, telefone"+(type==="Entrega"?" e endereço":"")+" para enviar.";restore();return}
    b.disabled=true;
    const{data,error}=await db.rpc("criar_pedido",{p_cliente:keep.cn,p_telefone:keep.cp,p_tipo:type,p_endereco:type==="Entrega"?keep.ca:"",p_obs:keep.co,p_pagamento:pg,p_itens:lines().map(l=>({id:l.id,qtd:l.q}))});
    if(error){V.err=error.message;await loadMenu();restore();return}
    V.paid={pg,tot:total()};V.last=data;V.step="done";cart={};
  }
  else if(a==="nav"){V.err="";V.q=id==="home"?"":V.q;V.step=id==="ped"?"meus":id==="cart"?"check":id==="perfil"?"perfil":"menu";if(id==="ped"&&V.user)await loadMine();V.fx=id==="busca"?"q":"top"}
  else if(a==="loja"){V.mode=V.auth?"loja":"conta";if(V.auth){await loadMenu();await loadOrders();subscribe()}}
  else if(a==="conta"){V.mode="conta";V.aba="entrar";V.msg=""}
  else if(a==="aba"){V.aba=id;V.msg=""}
  else if(a==="meus"){await loadMine();V.step="meus"}
  else if(a==="signup"){
    const nome=v("#rn"),tel=v("#rt"),email=v("#em"),senha=$("#pw").value,cod=v("#rc"),vend=V.aba==="vendedor";
    if(!nome||!email||senha.length<6)V.err="Preencha nome, e-mail e uma senha de 6 ou mais caracteres.";
    else{
      let ok=true;
      if(vend){const{data}=await db.rpc("codigo_vendedor_valido",{p_codigo:cod});ok=data===true;if(!ok)V.err="Código da loja incorreto."}
      if(ok){
        const{data,error}=await db.auth.signUp({email,password:senha,options:{data:{nome,telefone:tel,codigo:vend?cod:null}}});
        if(error)V.err=error.message;
        else if(!data.session)V.msg="Conta criada! Confirme pelo link enviado ao seu e-mail e depois clique em Entrar.";
        else{await loadMe();V.mode=V.auth?"loja":"cli";V.step="menu";await loadMenu();if(V.auth){await loadOrders();subscribe()}}
      }
    }
  }
  else if(a==="exit"){V.mode="cli";await loadMenu()}
  else if(a==="login"){
    const{error}=await db.auth.signInWithPassword({email:v("#em"),password:$("#pw").value});
    if(error)V.err="E-mail ou senha incorretos.";else{await loadMe();if(V.auth){V.mode="loja";await loadMenu();await loadOrders();subscribe()}else{V.mode="cli";V.step="menu";await loadMenu()}}
  }
  else if(a==="logout"){await db.auth.signOut();V.auth=false;V.user=null;V.perfil={};V.step="menu";V.mode="cli";await loadMenu()}
  else if(a==="tab")V.tab=id;
  else if(a==="f")V.f=id;
  else if(a==="next"||a==="cancel"){const o=orders.find(x=>x.numero==id);r=await db.from("pedidos").update({status:a==="next"?NEXT[o.status][0]:"cancelado"}).eq("numero",id);await loadOrders()}
  else if(a==="tog"){const m=menu.find(x=>x.id==id);r=await db.from("itens").update({disponivel:!m.disponivel}).eq("id",id);await loadMenu()}
  else if(a==="del"){if(!confirm("Remover este item do cardápio?"))return;const m=menu.find(x=>x.id==id);r=await db.from("itens").delete().eq("id",id);if(!r.error&&m&&m.foto_url)try{await rmFoto(m.foto_url)}catch(x){}await loadMenu()}
  else if(a==="saveCfg"){
    const n={nome_loja:v("#sn")||cfg.nome_loja,mensagem:v("#sm"),chave_pix:v("#sx"),cor_principal:$("#sc").value,cor_destaque:$("#sd").value};
    r=await db.from("configuracao").update(n).eq("id",1);if(!r.error)cfg={...cfg,...n};
  }
  if(r&&r.error)V.err=r.error.message;
  const F=["rn","rt","em","rc"],sv=F.map(i=>$("#"+i)&&$("#"+i).value);
  render();
  if(V.mode==="conta")F.forEach((i,k)=>{if($("#"+i)&&sv[k])$("#"+i).value=sv[k]});
});
document.addEventListener("change",e=>{if(e.target.id==="pf"){const f=e.target.files[0];e.target.value="";pickF(f)}});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest(".dz");if(z){e.preventDefault();z.classList.add("on")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest(".dz");if(z)z.classList.remove("on")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".dz");if(z){e.preventDefault();z.classList.remove("on");pickF(e.dataTransfer.files[0])}});
document.addEventListener("change",async e=>{
  const id=e.target.dataset.ch,p=parseFloat(e.target.value);if(!id||isNaN(p))return;
  const{error}=await db.from("itens").update({preco:p}).eq("id",id);
  if(error){V.err=error.message}else await loadMenu();render();
});

(async()=>{
  if(!configured){render();return}
  render();
  await loadMe();
  await Promise.all([loadCfg(),loadMenu()]);
  V.loading=false;render();
})();
</script>
</body>
</html>
